# Mirror third-party images this fork depends on into the
# ghcr.io/a10kiloham namespace, so CI, local builds and devices pull
# from a registry we control instead of upstream orgs that can move or
# delete artifacts (and Docker Hub's anonymous rate limit):
#
#   * oven/bun — the Dockerfile builder base.
#   * ghcr.io/screenly-labs/wifi-connect — the captive-portal image the
#     compose file pins. Mirrored with `cosign copy` (image + legacy
#     signature tags) plus a `crane cp` of the sha256-<digest> fallback
#     tag that holds upstream's bundle-format release signatures, then
#     verified in-job with the exact command devices run —
#     bin/verify_image_signatures.sh verifies the mirror against
#     upstream's release.yml identity before starting the portal.
# This whole workflow becomes redundant once oven-sh/bun publishes
# official GHCR images — track https://github.com/oven-sh/bun/issues/30365.
# `docker buildx imagetools create` is a manifest-level copy: it
# rewrites the manifest pointer so all per-arch layers are inherited
# from the source registry without re-uploading content. The op is
# idempotent — re-runs against an unchanged source produce no new
# digest, so the daily cron is a cheap re-assertion rather than a
# republish.
#
# Bumping the bun tag: update the BUN_TAG below AND the matching
# `oven/bun:<tag>` -> `ghcr.io/a10kiloham/bun:<tag>` references in
# docker/Dockerfile.server.j2 and docker/Dockerfile.test.j2 in the
# same PR, then trigger this workflow via `workflow_dispatch` before
# the dependent change merges so the new tag is mirrored before any
# build tries to pull it.

name: Mirror third-party images to GHCR

on:
  schedule:
    # Daily at 04:17 UTC — off-peak and offset from the top-of-hour
    # cron stampede that GitHub-hosted runners see.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    env:
      BUN_TAG: 1.3.13-slim
      SRC_IMAGE: oven/bun
      DST_IMAGE: ghcr.io/a10kiloham/bun
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror ${{ env.SRC_IMAGE }}:${{ env.BUN_TAG }} -> ${{ env.DST_IMAGE }}:${{ env.BUN_TAG }}
        run: |
          set -euo pipefail
          src="${SRC_IMAGE}:${BUN_TAG}"
          dst="${DST_IMAGE}:${BUN_TAG}"
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools create -t "${dst}" "${src}"; then
              echo "Mirrored ${src} -> ${dst}"
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              delay=$((2 ** attempt))
              echo "Attempt ${attempt} failed; retrying in ${delay}s..." >&2
              sleep "${delay}"
            fi
          done
          echo "Giving up after 5 attempts mirroring ${src} -> ${dst}" >&2
          exit 1

  mirror-wifi-connect:
    runs-on: ubuntu-24.04
    env:
      # Keep in lockstep with the wifi-connect pin in
      # docker-compose.yml.tmpl: bump both in the same PR, then
      # dispatch this workflow BEFORE the compose change reaches
      # devices, so the mirrored tag exists before anything pulls it.
      WIFI_CONNECT_TAG: 2026.10.13
      SRC_IMAGE: ghcr.io/screenly-labs/wifi-connect
      DST_IMAGE: ghcr.io/a10kiloham/wifi-connect
    steps:
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      # crane does the byte-exact tag copies cosign can't: upstream's
      # release signatures are sigstore *bundles*, stored as an OCI
      # index under the referrers fallback tag `sha256-<digest>`, and
      # `cosign copy` v3.1.4 only carries the legacy `.sig`/`.att`
      # tag forms — it mirrored the image while silently leaving the
      # bundle signatures behind (found by the first on-device
      # verification, 2026-11-20).
      - name: Install crane
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/crane.tar.gz \
            https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          echo "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0  /tmp/crane.tar.gz" \
            | sha256sum -c -
          tar -C /usr/local/bin -xzf /tmp/crane.tar.gz crane

      # `cosign copy` moves the image and any legacy-form
      # signatures/attestations; the crane pass after it moves the
      # bundle-form signatures living under the fallback tag. Either
      # alone is incomplete, and the verify step below is the actual
      # postcondition: the mirror must verify with the same command
      # and identity bin/verify_image_signatures.sh uses on devices,
      # or devices will refuse to start the portal.
      - name: Mirror ${{ env.SRC_IMAGE }}:${{ env.WIFI_CONNECT_TAG }} -> ${{ env.DST_IMAGE }}:${{ env.WIFI_CONNECT_TAG }}
        run: |
          set -euo pipefail
          src="${SRC_IMAGE}:${WIFI_CONNECT_TAG}"
          dst="${DST_IMAGE}:${WIFI_CONNECT_TAG}"
          for attempt in 1 2 3 4 5; do
            if cosign copy --force "${src}" "${dst}"; then
              echo "Mirrored ${src} -> ${dst}"
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "Giving up after 5 attempts mirroring ${src} -> ${dst}" >&2
              exit 1
            fi
            delay=$((2 ** attempt))
            echo "Attempt ${attempt} failed; retrying in ${delay}s..." >&2
            sleep "${delay}"
          done

          digest="$(crane digest "${src}")"
          fallback="sha256-${digest#sha256:}"
          if crane manifest "${SRC_IMAGE}:${fallback}" > /dev/null 2>&1; then
            crane cp "${SRC_IMAGE}:${fallback}" "${DST_IMAGE}:${fallback}"
            echo "Mirrored bundle signatures ${SRC_IMAGE}:${fallback}"
          else
            echo "No fallback signature tag upstream; relying on" \
                 "legacy-form signatures from cosign copy." >&2
          fi

      - name: Verify the mirror as a device would
        run: |
          set -euo pipefail
          digest="$(crane digest "${DST_IMAGE}:${WIFI_CONNECT_TAG}")"
          cosign verify \
            --certificate-identity "https://github.com/Screenly-Labs/wifi-connect/.github/workflows/release.yml@refs/tags/v${WIFI_CONNECT_TAG}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${DST_IMAGE}@${digest}" > /dev/null
          echo "Mirror verifies against upstream's release identity."
