# Mirror third-party images this fork depends on into the
# ghcr.io/a10kiloham namespace, so CI, local builds and devices pull
# from a registry we control instead of upstream orgs that can move or
# delete artifacts (and Docker Hub's anonymous rate limit):
#
#   * oven/bun — the Dockerfile builder base.
#   * ghcr.io/screenly-labs/wifi-connect — the captive-portal image the
#     compose file pins. Mirrored with `cosign copy` rather than
#     imagetools so upstream's release signatures ride along —
#     bin/verify_image_signatures.sh on devices verifies the mirror
#     against upstream's release.yml identity.
# This whole workflow becomes redundant once oven-sh/bun publishes
# official GHCR images — track https://github.com/oven-sh/bun/issues/30365.
# `docker buildx imagetools create` is a manifest-level copy: it
# rewrites the manifest pointer so all per-arch layers are inherited
# from the source registry without re-uploading content. The op is
# idempotent — re-runs against an unchanged source produce no new
# digest, so the daily cron is a cheap re-assertion rather than a
# republish.
#
# Bumping the bun tag: update the BUN_TAG below AND the matching
# `oven/bun:<tag>` -> `ghcr.io/a10kiloham/bun:<tag>` references in
# docker/Dockerfile.server.j2 and docker/Dockerfile.test.j2 in the
# same PR, then trigger this workflow via `workflow_dispatch` before
# the dependent change merges so the new tag is mirrored before any
# build tries to pull it.

name: Mirror third-party images to GHCR

on:
  schedule:
    # Daily at 04:17 UTC — off-peak and offset from the top-of-hour
    # cron stampede that GitHub-hosted runners see.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    env:
      BUN_TAG: 1.3.13-slim
      SRC_IMAGE: oven/bun
      DST_IMAGE: ghcr.io/a10kiloham/bun
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror ${{ env.SRC_IMAGE }}:${{ env.BUN_TAG }} -> ${{ env.DST_IMAGE }}:${{ env.BUN_TAG }}
        run: |
          set -euo pipefail
          src="${SRC_IMAGE}:${BUN_TAG}"
          dst="${DST_IMAGE}:${BUN_TAG}"
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools create -t "${dst}" "${src}"; then
              echo "Mirrored ${src} -> ${dst}"
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              delay=$((2 ** attempt))
              echo "Attempt ${attempt} failed; retrying in ${delay}s..." >&2
              sleep "${delay}"
            fi
          done
          echo "Giving up after 5 attempts mirroring ${src} -> ${dst}" >&2
          exit 1

  mirror-wifi-connect:
    runs-on: ubuntu-24.04
    env:
      # Keep in lockstep with the wifi-connect pin in
      # docker-compose.yml.tmpl: bump both in the same PR, then
      # dispatch this workflow BEFORE the compose change reaches
      # devices, so the mirrored tag exists before anything pulls it.
      WIFI_CONNECT_TAG: 2026.10.13
      SRC_IMAGE: ghcr.io/screenly-labs/wifi-connect
      DST_IMAGE: ghcr.io/a10kiloham/wifi-connect
    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'

      # `cosign copy` moves the image AND its signatures/attestations,
      # which a manifest-level imagetools copy would leave behind —
      # and the device-side verification depends on them surviving.
      - name: Mirror ${{ env.SRC_IMAGE }}:${{ env.WIFI_CONNECT_TAG }} -> ${{ env.DST_IMAGE }}:${{ env.WIFI_CONNECT_TAG }}
        run: |
          set -euo pipefail
          src="${SRC_IMAGE}:${WIFI_CONNECT_TAG}"
          dst="${DST_IMAGE}:${WIFI_CONNECT_TAG}"
          for attempt in 1 2 3 4 5; do
            if cosign copy --force "${src}" "${dst}"; then
              echo "Mirrored ${src} -> ${dst} (signatures included)"
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              delay=$((2 ** attempt))
              echo "Attempt ${attempt} failed; retrying in ${delay}s..." >&2
              sleep "${delay}"
            fi
          done
          echo "Giving up after 5 attempts mirroring ${src} -> ${dst}" >&2
          exit 1
